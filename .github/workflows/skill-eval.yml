name: Skill evaluation

# Manual only, and deliberately separate from the static scan. The scan is a
# gate: it runs on every push and its failure means "do not ship this". This
# runs a skill against a dataset to see how well it performs, which costs model
# calls and whose result is a score, not a verdict. Sharing a workflow would
# blur the scan's failure into "something scored badly".
on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to evaluate. Leave blank to run every skill that has a dataset.'
        type: string
        required: false
        default: ''
      propose:
        description: 'Rewrite each scored skill from its shortfalls and open a pull request'
        type: boolean
        required: false
        default: false

# Write access is scoped to this workflow, which is manual-dispatch only, and it
# is used for exactly one thing: pushing a proposal to its own branch. Nothing
# here writes to main, and the pull request is opened by a person from the link
# in the summary — this repository is a gate, and letting Actions open pull
# requests into it is a permission it does not need in order to do its job.
permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -c "import importlib.metadata as m; print('arize', m.version('arize'), 'ax', m.version('arize-ax-cli'))"

      - name: Configure the ax profile
        # The runner has no ~/.arize and the ax CLI needs an active profile;
        # ARIZE_API_KEY alone is not enough. --output-format json is
        # load-bearing — the harness parses ax's stdout.
        env:
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          ax profiles create ci \
            --api-key "$ARIZE_API_KEY" \
            --auth-method api-key \
            --output-format json
          ax profiles use ci

      - name: Run evaluation
        env:
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          # The scan never needed this: it judges skill text, and Arize's own
          # evaluator makes that model call server-side. This workflow runs the
          # skill, so the call happens here.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed as an environment variable, never interpolated into the
          # script body. `skill` is free text from whoever dispatches the
          # workflow, and `${{ inputs.skill }}` inside `run:` would let them
          # append arbitrary shell. (The scan's `scan_all` input is safe to
          # interpolate only because it is a boolean.)
          SKILL: ${{ inputs.skill }}
          PROPOSE: ${{ inputs.propose }}
        run: |
          ARGS=""
          [ "$PROPOSE" = "true" ] && ARGS="--propose"
          if [ -n "$SKILL" ]; then
            python -m harness.run_eval --skill "$SKILL" $ARGS
          else
            python -m harness.run_eval $ARGS
          fi

      - name: Keep the proposal
        if: inputs.propose
        # Runs before the scan and on failure, because a proposal that fails the
        # gate is the one worth reading. Without this it lives only in the
        # runner's working tree: the pull-request step is skipped, the branch is
        # never pushed, and the thing that failed is gone.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: proposed-skills
          path: skills/*/SKILL.md
          if-no-files-found: ignore

      - name: Scan the proposed skills
        if: inputs.propose
        # A proposal is a model-authored edit to a skill in a registry whose
        # whole point is that skills get scanned. Asking a reviewer to read it
        # before it has passed the same gate would invert this repo's premise.
        # SLACK_WEBHOOK_URL is deliberately unset: a proposal that fails the gate
        # is caught here and never becomes a pull request, so it is not the kind
        # of failure the channel exists to announce.
        env:
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          CHANGED=$(git diff --name-only -- 'skills/*/SKILL.md')
          if [ -z "$CHANGED" ]; then
            echo "No skill was rewritten — nothing to scan."
            exit 0
          fi
          for f in $CHANGED; do
            python -m harness.static_scan --skill "$(dirname "$f")"
          done

      - name: Push the proposal to a branch
        if: inputs.propose
        run: |
          if git diff --quiet -- 'skills/*/SKILL.md'; then
            echo "No skill was rewritten — no branch to push."
            exit 0
          fi
          # The branch name is built from the run id alone. `skill` is free text
          # from whoever dispatched the workflow, and it does not belong in a
          # shell-expanded git ref.
          BRANCH="improve/eval-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- 'skills/*/SKILL.md'
          git commit -m "Rewrite scanned skills from their evaluation shortfalls"
          git push -u origin "$BRANCH"
          {
            echo
            echo "### Proposal pushed"
            echo
            echo "Open the pull request from here:"
            echo
            echo "${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
            echo
            echo "These edits passed the static scan. They have **not** been re-evaluated —"
            echo "run this workflow on the branch to see whether the score actually moved,"
            echo "and read the diff on its own merits either way."
            echo
            echo '```'
            git diff --stat main -- 'skills/*/SKILL.md'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

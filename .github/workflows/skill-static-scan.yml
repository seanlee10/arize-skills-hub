name: Skill static scan

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'policy/**'
      - 'harness/**'
      - '.github/workflows/skill-static-scan.yml'
  # Manual trigger. Also the way to get a run when a push cannot be path-filtered
  # — a branch creation or a force push gives GitHub no diff base, so the paths
  # filter above skips those pushes entirely.
  workflow_dispatch:
    inputs:
      scan_all:
        description: 'Scan every registered skill instead of the last commit diff'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits so the parent is available for the diff.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Two steps on purpose: arize-ax-cli pins arize==8.43.1, which cannot
        # deserialize the experiments this scan creates. Resolving both pins at
        # once is impossible, but pip accepts the upgrade applied afterwards.
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --upgrade arize==8.44.0
          python -c "import importlib.metadata as m; print('arize', m.version('arize'), 'ax', m.version('arize-ax-cli'))"

      - name: Configure the ax profile
        # The runner is a fresh container with no ~/.arize, and the ax CLI
        # requires an active profile — ARIZE_API_KEY alone is not enough.
        env:
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          ax profiles create ci --api-key "$ARIZE_API_KEY" --auth-method api-key
          ax profiles use ci
          ax spaces list --limit 1 > /dev/null && echo "ax profile is usable"

      - name: Run static scan
        env:
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m harness.static_scan ${{ inputs.scan_all && '--all' || '' }}

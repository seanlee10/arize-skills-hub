name: Skill static scan

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'policy/**'
      - 'harness/**'
      - '.github/workflows/skill-static-scan.yml'
  # Manual trigger. Also the way to get a run when a push cannot be path-filtered
  # — a branch creation or a force push gives GitHub no diff base, so the paths
  # filter above skips those pushes entirely.
  workflow_dispatch:
    inputs:
      scan_all:
        description: 'Scan every registered skill instead of the last commit diff'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits so the parent is available for the diff.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # One step now: arize-ax-cli 0.32.0 pins an arize that can deserialize
        # what this server returns, so the pair resolves without an upgrade
        # applied on top. The version line stays — it is what identified the
        # last two server-drift breakages.
        run: |
          python -m pip install -r requirements.txt
          python -c "import importlib.metadata as m; print('arize', m.version('arize'), 'ax', m.version('arize-ax-cli'))"

      - name: Check the SDK still matches the server
        # Fails with a named field rather than an opaque parse error mid-scan.
        run: python -m pytest tests/test_arize_sdk_contract.py -q

      - name: Configure the ax profile
        # The runner is a fresh container with no ~/.arize, and the ax CLI
        # requires an active profile — ARIZE_API_KEY alone is not enough.
        env:
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          # --output-format json is load-bearing: the harness parses ax's stdout,
          # and the profile's output format decides what ax prints. A profile
          # created without it defaults to table output and every parse fails
          # with "printed no JSON".
          ax profiles create ci \
            --api-key "$ARIZE_API_KEY" \
            --auth-method api-key \
            --output-format json
          ax profiles use ci
          ax spaces list --limit 1 | head -c 1 | grep -q '{' \
            && echo "ax profile is usable and prints JSON"

      - name: Run static scan
        env:
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m harness.static_scan ${{ inputs.scan_all && '--all' || '' }}
